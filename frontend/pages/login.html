<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ColdVault — Admin Login</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,0..40,300&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --bg-void: #f7fafc;
            --bg-deep: #eef2f7;

            --accent-ice: #2563eb;
            --accent-frost: #60a5fa;
            --accent-cryo: #1d4ed8;

            --border-subtle: rgba(15, 23, 42, 0.12);
            --border-active: rgba(37, 99, 235, 0.35);

            --text-primary: #0f172a;
            --text-secondary: rgba(15, 23, 42, 0.72);
            --text-muted: rgba(15, 23, 42, 0.48);

            --surface-1: #ffffff;
            --surface-2: #f1f5f9;

            --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.06);
            --shadow-md: 0 12px 28px rgba(15, 23, 42, 0.10);

            --font-display: "Syne", sans-serif;
            --font-body: "DM Sans", sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-body);
            background: var(--bg-void);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Background orbs */

        .bg-orb {
            position: fixed;
            pointer-events: none;
            z-index: 0;
            border-radius: 50%;
        }

        .bg-orb.one {
            width: 600px;
            height: 600px;
            background: radial-gradient(circle,
                    rgba(37, 99, 235, 0.08),
                    transparent 70%);
            top: -10%;
            left: 60%;
        }

        .bg-orb.two {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle,
                    rgba(96, 165, 250, 0.07),
                    transparent 70%);
            bottom: 10%;
            left: 5%;
        }

        .login-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 1;
            padding: 24px;
        }

        /* Back button */

        .back-btn {
            position: absolute;
            top: 28px;
            left: 36px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: none;
            border: 1px solid var(--border-subtle);
            border-radius: 10px;
            padding: 8px 18px;
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 15px;
            font-family: var(--font-body);
            z-index: 10;
            transition: all 0.2s;
            text-decoration: none;
        }

        .back-btn:hover {
            background: rgba(37, 99, 235, 0.06);
            border-color: var(--accent-ice);
            color: var(--accent-ice);
        }

        /* Login card */

        .login-card {
            position: relative;
            z-index: 1;
            background: var(--surface-1);
            border: 1px solid var(--border-subtle);
            border-radius: 20px;
            padding: 48px 44px;
            width: 100%;
            max-width: 440px;
            box-shadow: var(--shadow-md);
            animation: fadeInUp 0.4s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(24px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 36px;
        }

        .logo-icon {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, #2563eb, #60a5fa);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            flex-shrink: 0;
        }

        .logo-text {
            font-family: var(--font-display);
            font-size: 22px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .logo-text span {
            color: var(--accent-ice);
        }

        .login-card h2 {
            font-family: var(--font-display);
            font-size: 26px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 6px;
        }

        .login-card .subtitle {
            font-size: 15px;
            color: var(--text-muted);
            margin-bottom: 32px;
        }

        .form-label-custom {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .form-control-custom {
            width: 100%;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1.5px solid var(--border-subtle);
            background: var(--surface-2);
            font-size: 15px;
            color: var(--text-primary);
            font-family: var(--font-body);
            outline: none;
            transition: border-color 0.2s;
        }

        .form-control-custom:focus {
            border-color: var(--accent-ice);
        }

        .form-control-custom.is-invalid {
            border-color: #ef4444 !important;
        }

        .password-wrap {
            position: relative;
        }

        .password-wrap .form-control-custom {
            padding-right: 44px;
        }

        .toggle-pass {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 16px;
            padding: 4px;
            line-height: 1;
        }

        .error-box {
            background: rgba(239, 68, 68, 0.08);
            border: 1px solid rgba(239, 68, 68, 0.25);
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 20px;
            font-size: 14px;
            color: #ef4444;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .success-box {
            background: rgba(34, 197, 94, 0.08);
            border: 1px solid rgba(34, 197, 94, 0.25);
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 20px;
            font-size: 14px;
            color: #16a34a;
        }

        .btn-primary-custom {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            font-size: 16px;
            font-family: var(--font-display);
            font-weight: 600;
            letter-spacing: 0.02em;
            color: #fff;
            background: linear-gradient(135deg, #2563eb, #60a5fa);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .btn-primary-custom:hover {
            box-shadow: 0 10px 26px rgba(37, 99, 235, 0.22);
            transform: translateY(-1px);
        }

        .btn-primary-custom:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .signup-text {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: var(--text-muted);
        }

        .signup-text a {
            background: none;
            border: none;
            color: var(--accent-ice);
            cursor: pointer;
            font-size: 14px;
            font-family: var(--font-body);
            padding: 0;
            text-decoration: none;
        }

        .signup-text a:hover {
            text-decoration: underline;
        }

        .spinner {
            width: 17px;
            height: 17px;
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <div class="bg-orb one"></div>
    <div class="bg-orb two"></div>

    <a href="javascript:history.back()" class="back-btn">
        ← Back
    </a>

    <div class="login-wrapper">

        <div class="login-card">

            <!-- Logo -->
            <div class="logo-row">

                <div class="logo-icon">

                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
                        stroke-linecap="round" stroke-linejoin="round">

                        <line x1="12" y1="2" x2="12" y2="22" />
                        <line x1="2" y1="12" x2="22" y2="12" />

                        <polyline points="6,6 12,2 18,6" />
                        <polyline points="6,18 12,22 18,18" />

                        <polyline points="2,8 6,6 8,10" />
                        <polyline points="22,8 18,6 16,10" />

                        <polyline points="2,16 6,18 8,14" />
                        <polyline points="22,16 18,18 16,14" />

                    </svg>

                </div>

                <span class="logo-text">
                    COLD<span>VAULT</span>
                </span>

            </div>

            <h2>Admin Login</h2>

            <p class="subtitle">
                Sign in to access the dashboard
            </p>

            <!-- Error message -->
            <div id="errorBox" class="error-box" style="display: none;">
                <span>⚠</span>
                <span id="errorMessage"></span>
            </div>

            <!-- Login Form -->
            <form id="loginForm" novalidate>

                <!-- Email -->
                <div style="margin-bottom: 16px;">

                    <label class="form-label-custom" for="email">
                        Email address
                    </label>

                    <input type="email" id="email" name="email" class="form-control-custom"
                        placeholder="Enter admin email" autocomplete="email" autofocus required />

                </div>

                <!-- Password -->
                <div style="margin-bottom: 24px;">

                    <label class="form-label-custom" for="password">
                        Password
                    </label>

                    <div class="password-wrap">

                        <input type="password" id="password" name="password" class="form-control-custom"
                            placeholder="Enter admin password" autocomplete="current-password" required />

                        <button type="button" class="toggle-pass" id="togglePassword">
                            👁
                        </button>

                    </div>

                </div>

                <!-- Submit -->
                <button type="submit" class="btn-primary-custom" id="submitBtn">

                    <span id="submitLabel">
                        Sign In →
                    </span>

                </button>

                <p class="signup-text">
                    New user?
                    <a href="register.html">
                        Create an account
                    </a>
                </p>

            </form>

        </div>

    </div>


    <script>

        const API_URL = "http://127.0.0.1:8000";

        const loginForm = document.getElementById("loginForm");
        const emailInput = document.getElementById("email");
        const passwordInput = document.getElementById("password");

        const errorBox = document.getElementById("errorBox");
        const errorMessage = document.getElementById("errorMessage");

        const submitBtn = document.getElementById("submitBtn");
        const submitLabel = document.getElementById("submitLabel");

        const togglePassword = document.getElementById("togglePassword");


        // Show / hide password
        togglePassword.addEventListener("click", function () {

            if (passwordInput.type === "password") {

                passwordInput.type = "text";
                togglePassword.textContent = "🙈";

            } else {

                passwordInput.type = "password";
                togglePassword.textContent = "👁";

            }

        });


        // Show error
        function showError(message) {

            errorMessage.textContent = message;
            errorBox.style.display = "flex";

        }


        // Hide error
        function hideError() {

            errorBox.style.display = "none";

        }


        // Login
        loginForm.addEventListener("submit", async function (event) {

            event.preventDefault();

            hideError();

            const email = emailInput.value.trim();
            const password = passwordInput.value;


            // Basic frontend validation
            if (!email) {

                showError("Please enter your email address.");
                emailInput.focus();
                return;

            }

            if (!password) {

                showError("Please enter your password.");
                passwordInput.focus();
                return;

            }


            // Loading state
            submitBtn.disabled = true;

            submitLabel.innerHTML = `
                <span class="spinner"></span>
                Signing in...
            `;


            try {

                const response = await fetch(
                    `${API_URL}/auth/login`,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            email: email,
                            password: password
                        })
                    }
                );


                const data = await response.json();


                // FastAPI returned an error
                if (!response.ok) {

                    if (response.status === 401) {

                        throw new Error(
                            "Invalid email or password."
                        );

                    }

                    throw new Error(
                        data.detail || "Login failed."
                    );

                }


                // Login successful
                const accessToken = data.access_token;


                // Save JWT
                localStorage.setItem(
                    "access_token",
                    accessToken
                );


                // Go to dashboard
                window.location.href = "index.html";


            } catch (error) {

                console.error("Login error:", error);

                showError(
                    error.message ||
                    "Unable to connect to server."
                );

            } finally {

                submitBtn.disabled = false;

                submitLabel.textContent = "Sign In →";

            }

        });

    </script>

</body>

</html>
